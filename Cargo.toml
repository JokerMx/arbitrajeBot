[package]
name = "hyperliquid-mmaker-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.41", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde", "maths"] }
rust_decimal_macros = "1.36"
num-traits = "0.2"
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.10", features = ["v4"] }
hex = "0.4"

# API
warp = "0.3"
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"

# Base de datos
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "chrono", "uuid", "json"] }

# Hyperliquid SDK (mainnet API + firma EIP-712)
hypersdk = "0.2"
either = "1.13"

# Bybit API
hmac = "0.12"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3